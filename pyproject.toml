[project]
name = "bauble"
version = "1.3.0"
description = "Open-source LDAP RFC conformance test suite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "ldap3>=2.9.1",
    "pytest>=8.0.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/rumba-id/bauble"
Repository = "https://github.com/rumba-id/bauble"

[project.scripts]
bauble = "bauble.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bauble"]

[tool.ruff]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
