rfc = 3062
title = "LDAP Password Modify Extended Operation"

[[requirement]]
id = "3062:3:1"
section = "3"
severity = "must"
test_class = "A"
text = "The Password Modify extended operation changes the bound user's password and returns success."
covered_by = ["3062.2.1"]

[[requirement]]
id = "3062:3:2"
section = "3"
severity = "should"
test_class = "B"
text = "Servers SHOULD publish passwdModifyOID (1.3.6.1.4.1.4203.1.11.1) in supportedExtension."
covered_by = []

[[requirement]]
id = "3062:3:3"
section = "3"
severity = "must"
test_class = "A"
text = "An incorrect oldPasswd leaves the password unchanged with a non-success result."
covered_by = ["3062.3.3"]

[[requirement]]
id = "3062:3:4"
section = "3"
severity = "must"
test_class = "A"
text = "The Password Modify operation SHALL NOT be used anonymously (server rejects)."
covered_by = ["3062.3.4"]
