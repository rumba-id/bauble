rfc = 2696
title = "LDAP Control Extension for Simple Paged Results Manipulation"

[[requirement]]
id = "2696:3:1"
section = "3"
severity = "must"
test_class = "A"
text = "A search with the paged-results control is accepted and the server returns a page of results with a cookie."
covered_by = ["2696.2.1"]

[[requirement]]
id = "2696:3:2"
section = "3"
severity = "must"
test_class = "A"
text = "The cookie is empty when no more entries remain, non-empty when more pages follow."
covered_by = ["2696.2.2"]

[[requirement]]
id = "2696:3:3"
section = "3"
severity = "should"
test_class = "B"
text = "Servers SHOULD publish 1.2.840.113556.1.4.319 in supportedControl."
covered_by = []
note = "SHOULD-level advertisement; absence is not a conformance failure."
