rfc = 6171
title = "LDAP: Don't Use Copy Control"

[[requirement]]
id = "6171:3:1"
section = "3"
severity = "should"
test_class = "A"
text = "Servers implementing this control SHOULD publish 1.3.6.1.1.22 in supportedControl."
covered_by = ["6171.3.1"]

[[requirement]]
id = "6171:3:2"
section = "3"
severity = "must"
test_class = "B"
text = "The Don't Use Copy control's criticality MUST be TRUE; controlValue is absent."
covered_by = []
note = "Client-side control-construction requirement (criticality MUST be TRUE)."

[[requirement]]
id = "6171:3:3"
section = "3"
severity = "must"
test_class = "B"
text = "An operation with the Don't Use Copy control MUST be performed on original (master) information."
covered_by = []
note = "Master-vs-copy provenance is not observable on a single instance."
