rfc = 4526
title = "LDAP: Absolute True and False Filters"

[[requirement]]
id = "4526:2:1"
section = "2"
severity = "must"
test_class = "A"
text = "An 'and' filter with zero elements SHALL evaluate to True (represented '(&)')."
covered_by = ["4526.2.1"]

[[requirement]]
id = "4526:2:2"
section = "2"
severity = "must"
test_class = "A"
text = "An 'or' filter with zero elements SHALL evaluate to False (represented '(|)')."
covered_by = ["4526.2.2"]

[[requirement]]
id = "4526:2:3"
section = "2"
severity = "should"
test_class = "A"
text = "Servers supporting this feature SHOULD publish OID 1.3.6.1.4.1.4203.1.5.3 in supportedFeatures."
covered_by = ["4526.2.3"]

[[requirement]]
id = "4526:2:4"
section = "2"
severity = "must"
test_class = "A"
text = "Implementations SHALL allow 'and' and 'or' filter choices with zero elements."
covered_by = ["4526.2.1", "4526.2.2"]
