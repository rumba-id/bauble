rfc = 4532
title = "LDAP: Who Am I? Operation"

[[requirement]]
id = "4532:3:1"
section = "3"
severity = "must"
test_class = "A"
text = "The Who-Am-I extended operation returns the current authorization identity (empty for anonymous)."
covered_by = ["4532.1.1"]

[[requirement]]
id = "4532:3:2"
section = "3"
severity = "should"
test_class = "B"
text = "Servers SHOULD advertise the whoami OID (1.3.6.1.4.1.4203.1.11.3) in supportedExtension."
covered_by = []
note = "SHOULD-level advertisement; absence is not a conformance failure."
