rfc = 4512
title = "LDAP: Directory Information Models"

[[requirement]]
id = "4512:5:1"
section = "5.1"
severity = "must"
test_class = "A"
text = "The root DSE is accessible and describes server-specific data."
covered_by = ["4512.4.1"]

[[requirement]]
id = "4512:5:2"
section = "5.1"
severity = "must"
test_class = "A"
text = "The root DSE publishes supportedLDAPVersion."
covered_by = ["4512.5.1.1"]

[[requirement]]
id = "4512:4:1"
section = "4.2"
severity = "must"
test_class = "A"
text = "The subschema subentry publishes objectClasses."
covered_by = ["4512.4.2"]

[[requirement]]
id = "4512:4:2"
section = "4.2"
severity = "must"
test_class = "A"
text = "The subschema subentry publishes attributeTypes."
covered_by = ["4512.4.3"]

[[requirement]]
id = "4512:3:1"
section = "3.3"
severity = "must"
test_class = "A"
text = "Every entry has an objectClass attribute."
covered_by = ["4512.4.4"]

[[requirement]]
id = "4512:4:3"
section = "4"
severity = "must"
test_class = "A"
text = "An entry missing a MUST attribute (per its object class) is rejected."
covered_by = ["4512.4.5"]

[[requirement]]
id = "4512:4:4"
section = "4"
severity = "must"
test_class = "A"
text = "Attribute values are validated against their declared syntax."
covered_by = ["4512.4.6"]

[[requirement]]
id = "4512:3:2"
section = "3.4"
severity = "should"
test_class = "A"
text = "Servers SHOULD maintain creatorsName/createTimestamp/modifiersName/modifyTimestamp."
covered_by = ["4512.3.2"]
note = "SHOULD-level maintenance; absence is not a conformance failure."

[[requirement]]
id = "4512:3:3"
section = "3.3"
severity = "must"
test_class = "A"
text = "The objectClass attribute cannot be removed from an entry."
covered_by = ["4512.3.3.1"]

[[requirement]]
id = "4512:3:4"
section = "3.4"
severity = "must"
test_class = "A"
text = "Operational attributes cannot be modified by clients."
covered_by = ["4512.3.4.1"]
