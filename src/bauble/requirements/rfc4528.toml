rfc = 4528
title = "LDAP: Assertion Control"

[[requirement]]
id = "4528:3:1"
section = "3"
severity = "must"
test_class = "A"
text = "When the assertion Filter evaluates TRUE, the operation is processed normally."
covered_by = ["4528.3.1"]

[[requirement]]
id = "4528:3:2"
section = "3"
severity = "must"
test_class = "A"
text = "When the assertion Filter evaluates FALSE or Undefined, assertionFailed (122) is returned and no processing occurs."
covered_by = ["4528.3.2"]

[[requirement]]
id = "4528:3:3"
section = "3"
severity = "must"
test_class = "A"
text = "The assertion control applies to update operations (Add, Delete, Modify, ModifyDN)."
covered_by = ["4528.3.3"]

[[requirement]]
id = "4528:3:4"
section = "3"
severity = "must"
test_class = "A"
text = "For Search, a FALSE assertion on the baseObject returns assertionFailed and no entries."
covered_by = ["4528.3.4"]

[[requirement]]
id = "4528:2:1"
section = "3"
severity = "should"
test_class = "B"
text = "Servers implementing this control SHOULD publish 1.3.6.1.1.12 in supportedControl."
covered_by = ["4528.2.1"]

[[requirement]]
id = "4528:3:5"
section = "3"
severity = "must"
test_class = "B"
text = "Assertion evaluation and operation processing SHALL be one atomic action."
covered_by = []
