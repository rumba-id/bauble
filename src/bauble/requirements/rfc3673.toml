rfc = 3673
title = "Lightweight Directory Access Protocol version 3 (LDAPv3): All Operational Attributes"

[[requirement]]
id = "3673:2:1"
section = "2"
severity = "must"
test_class = "A"
text = "A request for the '+' attribute selector MUST return all operational attributes."
covered_by = ["3673.2.1"]
[[requirement.obligation]]
id = "3673:2:1:present"
text = "Requesting '+' returns at least one operational attribute."
covered_by = ["3673.2.1"]

[[requirement.obligation]]
id = "3673:2:1:all"
text = "Requesting '+' returns ALL operational attributes."

[[requirement]]
id = "3673:2:2"
section = "2"
severity = "must"
test_class = "A"
text = "A request for both '*' and '+' MUST return all user and all operational attributes."
covered_by = ["3673.2.2"]
