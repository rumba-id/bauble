rfc = 5020
title = "LDAP: entryDN Operational Attribute"

[[requirement]]
id = "5020:2:1"
section = "2"
severity = "must"
test_class = "A"
text = "entryDN is an operational attribute available on entries (returned when '+' is requested)."
covered_by = ["5020.2.1"]

[[requirement]]
id = "5020:2:2"
section = "2"
severity = "must"
test_class = "A"
text = "entryDN holds a copy of the entry's current distinguished name."
covered_by = ["5020.2.2"]

[[requirement]]
id = "5020:2:3"
section = "2"
severity = "must"
test_class = "A"
text = "entryDN is SINGLE-VALUE and NO-USER-MODIFICATION."
covered_by = ["5020.2.3"]

[[requirement]]
id = "5020:2:4"
section = "2"
severity = "must"
test_class = "A"
text = "entryDN uses distinguishedNameMatch equality and is usable in search filters."
covered_by = ["5020.2.4"]
