rfc = 4529
title = "Requesting Attributes by Object Class in LDAP"

[[requirement]]
id = "4529:3:1"
section = "3"
severity = "must"
test_class = "A"
text = "'@<objectclass>' in an attribute list requests all attributes (MUST/MAY/SUP) of that object class."
covered_by = ["4529.3.1"]

[[requirement]]
id = "4529:3:2"
section = "3"
severity = "must"
test_class = "A"
text = "An unrecognized object class OID in an attribute list is treated as an unrecognized attribute description."
covered_by = ["4529.3.2"]

[[requirement]]
id = "4529:3:3"
section = "3"
severity = "should"
test_class = "B"
text = "Servers supporting this feature SHOULD publish OID 1.3.6.1.4.1.4203.1.5.2 in supportedFeatures."
covered_by = []
