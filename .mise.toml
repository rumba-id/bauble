# mise configuration for Rumba identity platform
# https://mise.jdx.dev/configuration.html

[tools]
# Python version lives in .python-version (single source shared with uv)
pipx = "latest"
uv = "latest"
yamllint = "latest"

node = "24"
"npm:markdownlint-cli" = "latest"

podman = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]

[settings.python]
compile = false
